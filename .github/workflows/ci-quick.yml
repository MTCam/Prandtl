name: CI Quick

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    name: Ubuntu/GCC
    runs-on: ubuntu-22.04
    env:
      CMAKE_BUILD_TYPE: Debug
      INSTALL_PREFIX: ${{ github.workspace }}/deps
      PYVISTA_OFF_SCREEN: "true"
      QT_QPA_PLATFORM: "offscreen"
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Show submodule SHAs (debug)
        run: git submodule status --recursive
      - name: Install toolchain and deps (MPI, hypre, metis)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-12 g++-12 gfortran-12 libgl1 libegl1 \
            mpich libmpich-dev environment-modules \
            cmake ninja-build pkg-config ccache jq libeigen3-dev
          echo "CC=mpicc"   >> $GITHUB_ENV
          echo "CXX=mpicxx" >> $GITHUB_ENV
          echo "FC=mpifort" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r ci-resources/requirements-ci.txt

      - name: Locate MFEM submodule
        id: mfemloc
        shell: bash
        run: |
          set -euo pipefail
          MFEM_SRC=""
          for d in libs/mfem external/mfem third_party/mfem mfem submodules/mfem; do
            if [[ -d "$d" ]]; then MFEM_SRC="$d"; break; fi
          done
          if [[ -z "$MFEM_SRC" ]]; then
            echo "ERROR: Could not find MFEM submodule. Expected one of: libs/mfem, external/mfem, third_party/mfem, mfem, submodules/mfem" >&2
            exit 1
          fi
          echo "MFEM_SRC=$MFEM_SRC" | tee -a $GITHUB_ENV

      - name: Build dependency submodules (HYPRE, METIS, MFEM, MPP)
        run: |
          # Make 'module' available so build_depends.sh sees IS_HPC=true and skips GLVis
          if [ -f /etc/profile.d/modules.sh ]; then
            source /etc/profile.d/modules.sh
          else
            # Fallback stub if modules.sh isn't present
            module() { return 0; }
            export -f module
          fi
          bash ./build_depends.sh

      - name: Show built dependency libs (debug)
        if: always()
        run: |
          ls -lh libs/mfem/* 2>/dev/null || true
          ls -lh libs/mfem/*/libmfem* 2>/dev/null || true
          ls -lh libs/hypre/src/hypre/lib 2>/dev/null || true
          ls -lh libs/metis-5.1.0/lib 2>/dev/null || true
          ls -lh libs/Mutationpp/install 2>/dev/null || true

      - name: Configure Prandtl (Euler)
        env:
          # CONFIG_FILE: compile_config.json
          CC: ${{ env.CC }}
          CXX: ${{ env.CXX }}
          FC: ${{ env.FC }}
          # These paths match your script’s build outputs
          MFEM_DIR: ${{ github.workspace }}/libs/mfem/build
          Eigen3_DIR: /usr/share/eigen3/cmake
          Mutationpp_DIR: ${{ github.workspace }}/libs/Mutationpp/install/lib/cmake/Mutationpp
        run: |
          mkdir -p build-euler
          #  -DCONFIG_FILE=${CONFIG_FILE}
          cmake -S . -B build-euler -G Ninja \
            -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE} \
            -DBUILD_TESTING=ON \
            -DCMAKE_PREFIX_PATH="${MFEM_DIR};${Eigen3_DIR}:${Mutationpp_DIR}" \
            -DSUBCELL_FV_BLENDING=ON -DNO_OPT=ON

      - name: Build Prandtl (Euler)
        run: cmake --build build-euler -- -k 0

      - name: Example smoke test (Euler, IsentropicVortex)
        run: |
          scripts/run_example.sh \
            -b "$(pwd)/build-euler" \
            -c TestCases/Euler/2D/IsentropicVortex/config.json \
            -t "0.002" -n 100

      - name: Configure Prandtl (CNS)
        env:
          # CONFIG_FILE: compile_config.json
          CC: ${{ env.CC }}
          CXX: ${{ env.CXX }}
          FC: ${{ env.FC }}
          # These paths match your script’s build outputs
          MFEM_DIR: ${{ github.workspace }}/libs/mfem/build
        run: |
          mkdir -p build-cns
          #  -DCONFIG_FILE=${CONFIG_FILE}
          cmake -S . -B build-cns -G Ninja \
            -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE} \
            -DBUILD_TESTING=ON \
            -DCMAKE_PREFIX_PATH="${MFEM_DIR};${Eigen3_DIR}:${Mutationpp_DIR}" \
            -DPARABOLIC=ON -DSUBCELL_FV_BLENDING=ON \
            -DNO_OPT=ON

      - name: Build Prandtl (CNS)
        run: cmake --build build-cns -- -k 0

      - name: Example smoke test (CNS, LidDrivenCavity)
        run: |
          scripts/run_example.sh \
            -b "$(pwd)/build-cns" \
            -c TestCases/NavierStokes/2D/LidDrivenCavity/config.json \
            -t "0.0001" -n 100

      - name: Example regression test (Cyclic - IsentropicVortex)
        run: |
          rm -rf RegressionTests/IsentropicVortex
          scripts/run_regression_test.sh \
            -b "$(pwd)/build-euler" \
            -c TestCases/Euler/2D/IsentropicVortex/config.json
          cd RegressionTests/IsentropicVortex
          python ../../scripts/compare_viz.py ParaView/ParaView.pvd --fields Density --atol 5e-5 --rtol 2e-6
          cd -

      - name: Example regression test (Gold standard - IsentropicVortex)
        run: |
          rm -rf RegressionTests/IsentropicVortex
          scripts/run_regression_test.sh \
            -t "0.001" \
            -n "500" \
            -b "$(pwd)/build-euler" \
            -c TestCases/Euler/2D/IsentropicVortex/config.json
          python scripts/compare_viz.py RegressionTests/IsentropicVortex/ParaView/Cycle000500/data.pvtu TestCases/GoldenData/IsentropicVortex/Cycle000500/data.pvtu --atol 1e-13 --rtol 1e-13

      - name: Example regression test (Gold standard - LidDrivenCavity)
        run: |
          rm -rf RegressionTests/LidDrivenCavity
          scripts/run_regression_test.sh \
            -t "0.0001" \
            -n "4000" \
            -b "$(pwd)/build-cns" \
            -c TestCases/NavierStokes/2D/LidDrivenCavity/config.json
          python scripts/compare_viz.py RegressionTests/LidDrivenCavity/ParaView/Cycle004000/data.pvtu TestCases/GoldenData/LidDrivenCavity/Cycle004000/data.pvtu --atol 1e-12 --rtol 1e-12

      - name: Example regression test (Gold standard - TaylorGreenVortex2D)
        run: |
          rm -rf RegressionTests/TaylorGreenVortex
          scripts/run_regression_test.sh \
            -t "0.0001" \
            -n "100" \
            -b "$(pwd)/build-cns" \
            -c TestCases/NavierStokes/2D/TaylorGreenVortex/config.json
          python scripts/compare_viz.py RegressionTests/TaylorGreenVortex/ParaView/Cycle000100/data.pvtu TestCases/GoldenData/TaylorGreenVortex2D/Cycle000100/data.pvtu --atol 1e-13 --rtol 1e-13

      - name: Example regression test (Gold standard - ForwardFacingStep)
        run: |
          cd TestCases/GoldenData
          tar zxvf ForwardFacingStep.tgz
          cd ../..
          rm -rf RegressionTests/ForwardFacingStep
          scripts/run_regression_test.sh \
            -t "0.0001" \
            -n "100" \
            -b "$(pwd)/build-euler" \
            -c TestCases/Euler/2D/ForwardFacingStep/config.json
          python scripts/compare_viz.py RegressionTests/ForwardFacingStep/ParaView/Cycle000100/data.pvtu TestCases/GoldenData/ForwardFacingStep/Cycle000100/data.pvtu --atol 1e-13 --rtol 1e-13

      - name: Unit tests (Euler)
        run: ctest --test-dir build-euler --output-on-failure
      - name: Unit tests (CNS)
        run: ctest --test-dir build-cns --output-on-failure

      - name: Upload quick artifacts (logs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prandtl-quick-logs
          path: |
            build-euler/Testing/**/Test.xml
            build-euler/CMakeCache.txt
            build-euler/**/*.log
            build-cns/Testing/**/Test.xml
            build-cns/CMakeCache.txt
            build-cns/**/*.log
            RegressionTests
            RunTests
 